name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    uses: bfren/docker/.github/workflows/build.yml@shared-build
    with:
      image: node
      folders: |
        20
        21
        22
        23
        24
        26
      platforms: |
        linux/amd64
        linux/arm/v7
        linux/arm64
      tags: |
        node${FOLDER}
        node${FOLDER}-${VERSION_MAJOR}
        node${FOLDER}-${VERSION_MINOR}
        node${FOLDER}-${VERSION}
        node${NODE_MINOR}
        node${NODE_MINOR}-${VERSION}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
